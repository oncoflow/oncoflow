# Configuration globale pour le module d'evaluation Oncoflow
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "oncoflow-agents-evaluation"

judge:
  # Route via le endpoint AI Gateway de MLflow (port 5000)
  provider: "mlflow"
  base_url: "http://127.0.0.1:5000/gateway/mlflow/v1"
  api_key: "not-needed"
  # Nom de l'endpoint configure dans MLflow Deployments / AI Gateway
  model: "oncoflow-evaluation"
  temperature: 0.0
  max_tokens: 4096
  timeout: 120

oncoflow:
  # Domaine par defaut
  default_domain: "oncology"
  supported_domains:
    - "oncology"
    - "sma"
  # Mode d'evaluation par defaut : "debate" (workflow RCP complet) ou "single_agent"
  default_mode: "debate"
  # Limite d'essais pour l'agent (retries Pydantic)
  max_retries: 3

evaluation:
  batch_size: 1
  save_prompt_suggestions: true
  export_markdown_reports: true
