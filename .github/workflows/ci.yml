name: CI/CD Oncoflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-security-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push steps (guarded by github.event_name == 'push')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/application/uv.lock"

      - name: Install dependencies
        run: |
          # uv installe la version de python requise et les dépendances (dev incluses pour la CI)
          cd application
          uv python install
          uv sync --frozen

      # Utilise la version de ruff verrouillée dans application/uv.lock (et non la dernière via uvx)
      - name: Lint with ruff
        run: |
          cd application
          uv run --frozen ruff format . --check

      - name: Ruff check
        run: |
          cd application
          uv run --frozen ruff check .

      # Type checking: non-blocking until the existing backlog of type errors is fixed
      - name: Type check (pyrefly)
        continue-on-error: true
        run: |
          cd application
          uv run --frozen pyrefly check src

      - name: Run Tests with Coverage
        run: |
          cd application
          PYTHONPATH=. uv run --frozen pytest --timeout=300 --cov=src --cov-report=xml:coverage.xml tests/ src/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./application/coverage.xml
          fail_ci_if_error: false
          slug: oncoflow/oncoflow
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Detect CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1" # Fait échouer le job si des vulnérabilités CRITICAL/HIGH sont trouvées
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          skip-dirs: "**/venv,**/.venv,**/dist,**/.cache,**/.pytest_cache"
          trivyignores: ".trivyignore"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          # Conversion en minuscules pour respecter le format docker
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          docker build -f dist/docker/Dockerfile -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest .

      - name: Push Docker image
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          if ! (docker push $IMAGE_ID:$VERSION && docker push $IMAGE_ID:latest); then
            echo "::warning title=GHCR Push Failed::Failed to push Docker image to ghcr.io ($IMAGE_ID:$VERSION / latest). Check GitHub Packages permissions in organization/repository settings."
          fi

  web-quality-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push steps (guarded by github.event_name == 'push')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci --prefix web --ignore-scripts=false

      - name: Security Audit (npm audit)
        run: npm audit --prefix web --audit-level=high

      - name: Lint, Typecheck & WCAG Contrast Check
        run: npm --prefix web run lint

      - name: Build Production TypeScript Bundle
        run: npm --prefix web run build

      - name: Run Unit & Integration Tests (Vitest)
        run: npm --prefix web run test

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm --prefix web run e2e

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          docker build -f dist/docker/Dockerfile.web -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest .

      - name: Push Web Docker image
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          if ! (docker push $IMAGE_ID:$VERSION && docker push $IMAGE_ID:latest); then
            echo "::warning title=GHCR Push Failed::Failed to push Web Docker image to ghcr.io ($IMAGE_ID:$VERSION / latest). Check GitHub Packages permissions in organization/repository settings."
          fi
