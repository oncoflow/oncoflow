name: CI/CD Oncoflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-security-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push steps (guarded by github.event_name == 'push')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/application/uv.lock"

      - name: Install dependencies
        run: |
          # uv installe la version de python requise et les dépendances (dev incluses pour la CI)
          cd application
          uv python install
          uv sync --frozen

      - name: Git hooks validation (prek)
        run: |
          uv run --project application --frozen prek run --all-files \
            --skip web-format \
            --skip web-lint \
            --skip web-build \
            --skip web-test

      # Utilise la version de ruff verrouillée dans application/uv.lock (et non la dernière via uvx)
      - name: Lint with ruff
        run: |
          cd application
          uv run --frozen ruff format . --check

      - name: Ruff check
        run: |
          cd application
          uv run --frozen ruff check .

      # Type checking: non-blocking until the existing backlog of type errors is fixed
      - name: Type check (pyrefly)
        continue-on-error: true
        run: |
          cd application
          uv run --frozen pyrefly check src

      - name: Run Tests with Coverage
        run: |
          cd application
          PYTHONPATH=. uv run --frozen pytest --timeout=300 --cov=src --cov-report=xml:coverage.xml tests/ src/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./application/coverage.xml
          flags: application
          fail_ci_if_error: false
          slug: oncoflow/oncoflow
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Detect CVEs (Trivy FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1" # Fait échouer le job si des vulnérabilités CRITICAL/HIGH sont trouvées
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          skip-dirs: "**/venv,**/.venv,**/dist,**/.cache,**/.pytest_cache,**/node_modules,**/coverage"
          trivyignores: ".trivyignore"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API and Streamlit Docker images in parallel
        id: build_image
        run: |
          BASE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          API_IMAGE_ID="${BASE_ID}-api"
          UI_IMAGE_ID="${BASE_ID}"
          VERSION=${{ github.sha }}
          echo "api_image_id=$API_IMAGE_ID" >> $GITHUB_OUTPUT
          echo "image_id=$UI_IMAGE_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          docker build -f dist/docker/Dockerfile.api -t $API_IMAGE_ID:$VERSION -t $API_IMAGE_ID:latest . &
          PID_API=$!
          docker build -f dist/docker/Dockerfile -t $UI_IMAGE_ID:$VERSION -t $UI_IMAGE_ID:latest . &
          PID_UI=$!
          wait $PID_API
          wait $PID_UI

      - name: Detect CVEs in API Docker image (Trivy Image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ steps.build_image.outputs.api_image_id }}:${{ steps.build_image.outputs.version }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Detect CVEs in Streamlit Docker image (Trivy Image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ steps.build_image.outputs.image_id }}:${{ steps.build_image.outputs.version }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Push API and Streamlit Docker images
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          API_IMAGE_ID=${{ steps.build_image.outputs.api_image_id }}
          IMAGE_ID=${{ steps.build_image.outputs.image_id }}
          VERSION=${{ steps.build_image.outputs.version }}
          (docker push $API_IMAGE_ID:$VERSION && docker push $API_IMAGE_ID:latest) &
          PID_API=$!
          (docker push $IMAGE_ID:$VERSION && docker push $IMAGE_ID:latest) &
          PID_UI=$!
          if ! (wait $PID_API && wait $PID_UI); then
            echo "::warning title=GHCR Push Failed::Failed to push Docker images to ghcr.io ($API_IMAGE_ID / $IMAGE_ID). Check GitHub Packages permissions in organization/repository settings."
          fi

  web-quality-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the push steps (guarded by github.event_name == 'push')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci --prefix web --ignore-scripts=false

      - name: Security Audit (npm audit)
        run: npm audit --prefix web --audit-level=high

      - name: Lint, Typecheck & WCAG Contrast Check
        run: npm --prefix web run lint

      - name: Build Production TypeScript Bundle
        run: npm --prefix web run build

      - name: Run Unit & Integration Tests with Coverage (Vitest)
        run: npm --prefix web run test:coverage

      - name: Upload Web coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
          slug: oncoflow/oncoflow
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Detect CVEs in Web (Trivy FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./web"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          skip-dirs: "**/dist,**/node_modules,**/coverage,**/playwright-report,**/test-results"
          trivyignores: ".trivyignore"

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm --prefix web run e2e

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Docker image
        id: build_web_image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}-web
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          docker build -f dist/docker/Dockerfile.web -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest .

      - name: Detect CVEs in Web Docker image (Trivy Image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ steps.build_web_image.outputs.image_id }}:${{ steps.build_web_image.outputs.version }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Push Web Docker image
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          IMAGE_ID=${{ steps.build_web_image.outputs.image_id }}
          VERSION=${{ steps.build_web_image.outputs.version }}
          if ! (docker push $IMAGE_ID:$VERSION && docker push $IMAGE_ID:latest); then
            echo "::warning title=GHCR Push Failed::Failed to push Web Docker image to ghcr.io ($IMAGE_ID:$VERSION / latest). Check GitHub Packages permissions in organization/repository settings."
          fi
