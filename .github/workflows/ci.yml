name: CI/CD Oncoflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-security-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Refuse patient files (public repository)
        run: .github/scripts/check_no_patient_files.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/application/uv.lock"

      - name: Install dependencies
        run: |
          # uv installe la version de python requise et les dépendances (dev incluses pour la CI)
          cd application
          uv python install
          uv sync --frozen

      # Utilise la version de ruff verrouillée dans application/uv.lock (et non la dernière via uvx)
      - name: Lint with ruff
        run: |
          cd application
          uv run --frozen ruff format . --check

      - name: Ruff check
        run: |
          cd application
          uv run --frozen ruff check .

      - name: Run Tests with Coverage
        run: |
          cd application
          PYTHONPATH=. uv run pytest --cov=src --cov-report=xml:coverage.xml tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./application/coverage.xml
          fail_ci_if_error: false
          slug: oncoflow/oncoflow
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Detect CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1" # Fait échouer le job si des vulnérabilités CRITICAL/HIGH sont trouvées
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          ignore-unfixed: true
          skip-dirs: "**/venv,**/.venv,**/dist,**/.cache,**/.pytest_cache"
          trivyignores: ".trivyignore"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          # Conversion en minuscules pour respecter le format docker
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          docker build -f dist/docker/Dockerfile -t $IMAGE_ID:$VERSION .

      - name: Push Docker image
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          if ! docker push $IMAGE_ID:$VERSION; then
            echo "::warning title=GHCR Push Failed::Failed to push Docker image to ghcr.io ($IMAGE_ID:$VERSION). Check GitHub Packages permissions in organization/repository settings."
          fi

  autoclave:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/autoclave
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "tools/autoclave/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Tests
        run: uv run --frozen pytest -q
