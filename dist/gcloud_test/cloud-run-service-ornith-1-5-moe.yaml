apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: llama-cpp-chat
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/minScale: "0"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/gpu-type: nvidia-l4
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: ghcr.io/ggml-org/llama.cpp:server-cuda12
        command:
        - "/bin/sh"
        - "-c"
        - |
          rm -rf /usr/local/cuda*/compat && ldconfig
          SERVER_BIN="/app/llama-server"
          [ -x "$SERVER_BIN" ] || SERVER_BIN="llama-server"
          if [ -f "/root/.cache/huggingface/models/Ornith-1.5-35B-A3B-IQ4_XS.gguf" ]; then
            MODEL_ARGS="-m /root/.cache/huggingface/models/Ornith-1.5-35B-A3B-IQ4_XS.gguf"
          else
            MODEL_ARGS="-hf bartowski/Ornith-1.5-35B-A3B-GGUF:IQ4_XS"
          fi
          exec $SERVER_BIN $MODEL_ARGS "$@"
        - "--"
        env:
        - name: GGML_CUDA_PDL
          value: "0"
        - name: GGML_CUDA_DISABLE_GRAPHS
          value: "0"
        - name: LD_LIBRARY_PATH
          value: "/usr/local/nvidia/lib64"
        args:
        # ─── Model ─────────────────────────────────────────────────────────────
        # ornith-ai/Ornith-1.5-35B-A3B — Mixture of Experts — IQ4_XS — ~80-120 T/s sur L4
        #
        # ARCHITECTURE MoE (qwen3_5_moe) :
        #   35B paramètres totaux en mémoire (256 experts routés, 8 actifs + 1 partagé)
        #   Seulement ~3B paramètres ACTIFS par token → débit élevé sur la bande passante L4 (300 Go/s)
        #   Optimisé par RL pour les workflows agentiques, le tool-calling et le raisonnement structuré
        #
        # BUDGET VRAM (L4 = 22.5 GiB utilisables avec ECC) :
        #   Pourquoi IQ4_XS (ou UD-IQ4_XS) et pas Q4_K_M ?
        #   - Q4_K_M pèse 21.86 GB → OOM dès l'allocation du KV cache 64k + buffers CUDA.
        #   - bartowski IQ4_XS : ~19.28 GB (ou peculiar-ragdoll UD-IQ4_XS sans bloc MTP : ~17.0 GB)
        #   - KV cache q4_0 @ 64k ctx × 1 slot : ~1.5 GB (architecture hybride GQA / Linear Attention)
        #   - Buffers CUDA / Flash Attention : ~0.5 GB
        #   - Total estimé : ~21.3 GB (IQ4_XS) ou ~19.0 GB (UD-IQ4_XS) → tient100% en VRAM sur 1x L4
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        # ─── Context ───────────────────────────────────────────────────────────
        # 64k tokens pour supporter les dossiers patients complets et synthèses RCP/MDT
        - "-c"
        - "64000"
        - "-n"
        - "8192"
        # ─── GPU ───────────────────────────────────────────────────────────────
        # Offload TOUS les layers (99) pour éviter tout aller-retour CPU sur les experts MoE
        - "-ngl"
        - "99"
        - "--flash-attn"
        - "on"
        - "--load-mode"
        - "none"
        # ─── Batch ─────────────────────────────────────────────────────────────
        - "-b"
        - "4096"
        - "-ub"
        - "1024"
        # ─── Threading & Slots ─────────────────────────────────────────────────
        - "-t"
        - "6"
        # 1 slot parallèle unique pour préserver la VRAM sur 1x L4 (24 Go)
        - "-np"
        - "1"
        # ─── Sampling (Recommandations officielles Ornith-1.5 pour Agents/Chat) ─
        # Contrairement à Qwen3.6 (temp=1.0, top-k=40), Ornith-1.5 recommande
        # temp=0.6, top-p=0.95, top-k=20 pour les workflows agentiques et le tool-calling.
        - "--temp"
        - "0.6"
        - "--top-p"
        - "0.95"
        - "--top-k"
        - "20"
        - "--min-p"
        - "0"
        - "--presence-penalty"
        - "1.5"
        - "--repeat-penalty"
        - "1.0"
        # ─── Thinking / Reasoning ──────────────────────────────────────────────
        - "--jinja"
        - "--reasoning-format"
        - "deepseek"
        - "--reasoning-budget"
        - "6144"
        - "--reasoning-budget-message"
        - "\nOkay, I have enough information to answer."
        - "--no-context-shift"
        - "--no-warmup"
        # ─── KV Cache ──────────────────────────────────────────────────────────
        - "--cache-type-k"
        - "q4_0"
        - "--cache-type-v"
        - "q4_0"
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          # 360 × 10s = 60 minutes (pour permettre le téléchargement initial sur GCS FUSE si non pré-peuplé)
          failureThreshold: 359
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"   # Modèle de ~19.3 GB, 32 GB RAM requis pour le chargement initial
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: gcs-hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: gcs-hf-cache
        csi:
          driver: gcsfuse.run.googleapis.com
          volumeAttributes:
            bucketName: oncoflow-models-cache
