apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: llama-cpp-chat
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/minScale: "0"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/gpu-type: nvidia-l4
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: ghcr.io/ggml-org/llama.cpp:server-cuda12
        command:
        - "/bin/sh"
        - "-c"
        - "rm -rf /usr/local/cuda*/compat && ldconfig && if [ -x /app/llama-server ]; then exec /app/llama-server \"$@\"; else exec llama-server \"$@\"; fi"
        - "--"
        env:
        - name: GGML_CUDA_PDL
          value: "0"
        - name: GGML_CUDA_DISABLE_GRAPHS
          value: "0"
        - name: LD_LIBRARY_PATH
          value: "/usr/local/nvidia/lib64"
        args:
        # ─── Model ─────────────────────────────────────────────────────────────
        # Qwen3.8-27B Q4_K_M — ~17.0 GB VRAM — ~16-18 T/s sur L4 (Dense)
        # ⚠️ ATTENTION DÉBIT MÉMOIRE SUR L4 :
        # Contrairement à Qwen 3.6 MoE (qui n'active que 3B paramètres et atteint ~100 T/s),
        # Qwen3.8-27B est un modèle DENSE : les 27B paramètres sont lus à CHAQUE token.
        # Bande passante L4 = 300 Go/s. Débit théorique max = 300 Go/s / 17 Go = ~17.6 T/s.
        # Si vous cherchez la VITESSE, utilisez :
        #   - Qwen3-8B (cloud-run-service-qwen3-8b.yaml) : ~45-55 T/s, 4 slots
        #   - Qwen3.6 MoE (cloud-run-service-qwen3-6-moe.yaml) : ~80-120 T/s, 1 slot
        - "-hf"
        - "unsloth/Qwen3.8-27B-GGUF:Q4_K_M"
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        # ─── Context ───────────────────────────────────────────────────────────
        # 40k tokens : grâce au DeltaNet, le KV cache est extrêmement léger (~1.8 GB à 40k)
        - "-c"
        - "40960"
        - "-n"
        - "32768"
        # ─── GPU ───────────────────────────────────────────────────────────────
        - "-ngl"
        - "99"
        - "--flash-attn"
        - "on"
        - "--load-mode"
        - "none"
        # ─── Batch ─────────────────────────────────────────────────────────────
        - "-b"
        - "4096"
        - "-ub"
        - "1024"
        # ─── Threading & Parallel slots ────────────────────────────────────────
        - "-t"
        - "6"
        # 1 slot parallèle : modèle de 17 GB + KV cache 40k ~2 GB = ~19 GB (marge de ~3.5 GB sur L4)
        - "-np"
        - "1"
        # ─── KV Cache ──────────────────────────────────────────────────────────
        - "--cache-type-k"
        - "q4_0"
        - "--cache-type-v"
        - "q4_0"
        # ─── Sampling ──────────────────────────────────────────────────────────
        - "--temp"
        - "1.0"
        - "--top-p"
        - "0.95"
        - "--top-k"
        - "40"
        - "--min-p"
        - "0"
        - "--presence-penalty"
        - "2.0"
        - "--repeat-penalty"
        - "1.0"
        # ─── Qwen3.8 Thinking ──────────────────────────────────────────────────
        - "--jinja"
        - "--reasoning-format"
        - "deepseek"
        # Budget de 8k tokens de réflexion : suffisant pour l'analyse approfondie de RCP et dossiers
        - "--reasoning-budget"
        - "8192"
        - "--reasoning-budget-message"
        - "\nOkay, I have enough information to answer."
        - "--no-context-shift"
        - "--no-warmup"
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 240
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"      # 17 GB modèle + buffers RAM
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: gcs-hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: gcs-hf-cache
        csi:
          driver: gcsfuse.run.googleapis.com
          volumeAttributes:
            bucketName: oncoflow-models-cache
