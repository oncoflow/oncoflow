x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "true"

x-ui-env: &ui-env
  APP_DEV_MODE: "false"
  APP_AUTH_MODE: "oauth_proxy"
  APP_LANGUAGE: ${APP_LANGUAGE:-french}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_LOG_TYPE: ${APP_LOG_TYPE:-json}
  APP_LOG_MAX_BYTES: ${APP_LOG_MAX_BYTES:-10485760}
  APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
  APP_CONFIGLLM_TYPE: "LiteLLM"
  APP_CONFIGLLM_URL: "http://litellm"
  APP_CONFIGLLM_PORT: "4000"
  APP_CONFIGLLM_EMBEDDINGS_PORT: "4000"
  APP_CONFIGLLM_MODELS: "openai/agents"
  APP_CONFIGLLM_EMBEDDINGS: "openai/embeddings"
  APP_CONFIGLLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env.prod}
  APP_MONGODB_HOST: "mongod"
  APP_MONGODB_PORT: "27017"
  APP_MONGODB_USER: ${APP_MONGODB_USER:-root}
  APP_MONGODB_PASSWORD: ${APP_MONGODB_PASSWORD:-root}
  APP_MILVUSDB_HOST: "milvus-standalone"
  APP_MILVUSDB_PORT: "19530"
  APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
  APP_QUEUE_ENABLED: ${APP_QUEUE_ENABLED:-true}
  APP_QUEUE_HARDWARE_PROFILE: ${APP_QUEUE_HARDWARE_PROFILE:-l4_24gb}
  APP_QUEUE_BATCH_SIZE: ${APP_QUEUE_BATCH_SIZE:-1}
  APP_QUEUE_API_URL: ${APP_QUEUE_API_URL:-http://oncoflow-api:8000}
  APP_API_TOKEN: ${APP_API_TOKEN:?APP_API_TOKEN must be set in .env.prod}
  APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}

x-ui-common: &ui-common
  image: ${ONCOFLOW_IMAGE:-ghcr.io/oncoflow/oncoflow}:${ONCOFLOW_TAG:-latest}
  restart: unless-stopped
  logging: *default-logging
  userns_mode: "keep-id"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/logs:/var/log/meddatasyntis
  depends_on:
    mongod:
      condition: service_healthy
    litellm:
      condition: service_started
  networks:
    - search-community
    - milvus

services:

  mongod:
    image: mongodb/mongodb-community-server:9.0-ubuntu2204
    container_name: oncoflow-mongod
    oom_score_adj: 200
    restart: unless-stopped
    logging: *default-logging
    entrypoint:
      - python3
      - -c
      - "import platform, sys; platform.release = lambda: '6.18.0'; sys.argv = ['/usr/local/bin/docker-entrypoint.py'] + sys.argv[1:]; exec(open('/usr/local/bin/docker-entrypoint.py').read())"
    command:
      - "mongod"
      - "--bind_ip_all"
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      HOME: "/tmp"
      MONGO_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:-root}
      MONGODB_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:-root}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/mongodb:/data/db
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - search-community

  # ─── LLM Raisonnement sur GPU NVIDIA L4 (24 Go VRAM) ─────────────────────────
  # Modèle : Ornith-1.5-35B-A3B-IQ4_XS (~19.3 Go poids + ~1.5 Go KV cache q4_0)
  llama-cpp-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    container_name: llama-cpp-chat-server
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GGML_CUDA_PDL=0
      - GGML_CUDA_DISABLE_GRAPHS=0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOME:-~}/.cache/huggingface:/root/.cache/huggingface
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/models:/models
      - ./model-config:/models-config:ro
    ipc: host
    # devices:
    #   - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /usr/local/cuda*/compat && ldconfig 2>/dev/null || true
        SERVER_BIN="/app/llama-server"
        [ -x "$$SERVER_BIN" ] || SERVER_BIN="llama-server"
        if [ -f "/models/Ornith-1.5-35B-A3B-IQ4_XS.gguf" ]; then
          MODEL_ARGS="-m /models/Ornith-1.5-35B-A3B-IQ4_XS.gguf"
        else
          MODEL_ARGS="-hf bartowski/Ornith-1.5-35B-A3B-GGUF:IQ4_XS"
        fi
        exec $$SERVER_BIN $$MODEL_ARGS "$$@"
      - --
    command:
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "-c"
      - "${LLM_CTX_SIZE:-64000}"
      - "-n"
      - "8192"
      - "-ngl"
      - "99"
      - "--flash-attn"
      - "on"
      - "--load-mode"
      - "none"
      - "-b"
      - "4096"
      - "-ub"
      - "1024"
      - "-t"
      - "6"
      - "-np"
      - "1"
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0"
      - "--presence-penalty"
      - "1.5"
      - "--repeat-penalty"
      - "1.0"
      - "--jinja"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-budget"
      - "6144"
      - "--reasoning-budget-message"
      - "\nOkay, I have enough information to answer."
      - "--no-context-shift"
      - "--no-warmup"
      - "--cache-type-k"
      - "q4_0"
      - "--cache-type-v"
      - "q4_0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - search-community

  # ─── Serveur d'Embeddings (bge-m3 sur CPU pour préserver les 24 Go VRAM L4) ──
  llama-cpp-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp-embeddings-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${HOME:-~}/.cache/huggingface:/root/.cache/huggingface
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/models:/models
    ipc: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        SERVER_BIN="/app/llama-server"
        [ -x "$$SERVER_BIN" ] || SERVER_BIN="llama-server"
        if [ -f "/models/bge-m3-F16.gguf" ]; then
          MODEL_ARGS="-m /models/bge-m3-F16.gguf"
        elif [ -f "/models/bge-m3-FP16.gguf" ]; then
          MODEL_ARGS="-m /models/bge-m3-FP16.gguf"
        else
          MODEL_ARGS="--hf-repo gpustack/bge-m3-GGUF --hf-file bge-m3-FP16.gguf"
        fi
        exec $$SERVER_BIN $$MODEL_ARGS "$$@"
      - --
    command:
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--embedding"
      - "-c"
      - "8192"
      - "-b"
      - "8192"
      - "-ub"
      - "8192"
      - "-ngl"
      - "0"
      - "-t"
      - "4"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - search-community

  # ─── Proxy LiteLLM unifié (Chat + Embeddings) ───────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env.prod}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "false"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.prod.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - llama-cpp-chat
      - llama-cpp-embeddings
    networks:
      - search-community

  # ─── Applications MedDataSyntis Streamlit UI (Déploiement optionnel : --profile streamlit) ──
  oncoflow-ui-oncology:
    <<: *ui-common
    container_name: oncoflow-ui-oncology
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      <<: *ui-env
      APP_DOMAIN: "oncology"
      APP_LOG_FILE: "/var/log/meddatasyntis/meddatasyntis-oncology.log"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis}/logs:/var/log/meddatasyntis
      - ${HOST_ONCOLOGIC_DIR:-/data/meddatasyntis/oncologic}/mtd:/app/application/ressources/PatientMDTForm/oncology
      - ${HOST_ONCOLOGIC_DIR:-/data/meddatasyntis/oncologic}/documents:/app/application/ressources/documents/oncology
    profiles:
      - "streamlit"

  oncoflow-ui-sma:
    <<: *ui-common
    container_name: oncoflow-ui-sma
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      <<: *ui-env
      APP_DOMAIN: "sma"
      APP_LOG_FILE: "/var/log/meddatasyntis/meddatasyntis-sma.log"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis}/logs:/var/log/meddatasyntis
      - ${HOST_SMA_DIR:-/data/meddatasyntis/sma}/mtd:/app/application/ressources/PatientMDTForm/sma
      - ${HOST_SMA_DIR:-/data/meddatasyntis/sma}/documents:/app/application/ressources/documents/sma
    profiles:
      - "streamlit"

  # ─── API Cross-Domains & File de Traitement intégrée (queue.PriorityQueue) ──
  oncoflow-api:
    <<: *ui-common
    container_name: oncoflow-api
    command: ["uv", "run", "--no-sync", "python", "app-api.py"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *ui-env
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
      APP_QUEUE_API_URL: ""
      APP_LOG_FILE: "/var/log/meddatasyntis/meddatasyntis-api.log"
      APP_ADMIN_USERS: ${APP_ADMIN_USERS:-}
      APP_ALLOW_REMOTE_LLM: ${APP_ALLOW_REMOTE_LLM:-false}
      APP_API_HOST: ${APP_API_HOST:-0.0.0.0}
      APP_API_PORT: ${APP_API_PORT:-8000}
      APP_API_WORKERS: ${APP_API_WORKERS:-1}
      APP_API_TIMEOUT_KEEP_ALIVE: ${APP_API_TIMEOUT_KEEP_ALIVE:-30}
      APP_API_PROXY_HEADERS: ${APP_API_PROXY_HEADERS:-true}
      APP_API_FORWARDED_ALLOW_IPS: ${APP_API_FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      APP_API_DOCS_ENABLED: ${APP_API_DOCS_ENABLED:-false}
      APP_API_DOCS_REQUIRE_AUTH: ${APP_API_DOCS_REQUIRE_AUTH:-true}
      APP_API_CORS_ENABLED: ${APP_API_CORS_ENABLED:-true}
      APP_API_CORS_ORIGINS: ${APP_API_CORS_ORIGINS:-https://oncologic.${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr},https://sma.${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr},https://oncologic-st.${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr},https://sma-st.${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr}}
      APP_API_CORS_ORIGIN_REGEX: ${APP_API_CORS_ORIGIN_REGEX:-}
      APP_API_CORS_ALLOW_CREDENTIALS: ${APP_API_CORS_ALLOW_CREDENTIALS:-true}
      APP_API_CORS_ALLOW_METHODS: ${APP_API_CORS_ALLOW_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_API_CORS_ALLOW_HEADERS: ${APP_API_CORS_ALLOW_HEADERS:-Authorization,Content-Type,X-API-Key,X-Oncoflow-Domain,X-Oncoflow-User,X-Oncoflow-User-Name,X-Oncoflow-Proxy-Secret,X-Request-ID,Accept,Origin,X-Requested-With}
      APP_API_CORS_EXPOSE_HEADERS: ${APP_API_CORS_EXPOSE_HEADERS:-X-Oncoflow-Domain,X-Request-ID,Content-Disposition}
      APP_API_CORS_MAX_AGE: ${APP_API_CORS_MAX_AGE:-600}
      APP_API_TRUSTED_HOSTS: ${APP_API_TRUSTED_HOSTS:-127.0.0.1,localhost,oncoflow-api,*.${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr}}
      APP_API_FORCE_HTTPS: ${APP_API_FORCE_HTTPS:-false}
      APP_API_GZIP_ENABLED: ${APP_API_GZIP_ENABLED:-true}
      APP_API_GZIP_MINIMUM_SIZE: ${APP_API_GZIP_MINIMUM_SIZE:-1000}
      APP_API_SECURITY_HEADERS_ENABLED: ${APP_API_SECURITY_HEADERS_ENABLED:-true}
      APP_API_HSTS_ENABLED: ${APP_API_HSTS_ENABLED:-true}
      APP_API_HSTS_MAX_AGE: ${APP_API_HSTS_MAX_AGE:-31536000}
      APP_API_HSTS_INCLUDE_SUBDOMAINS: ${APP_API_HSTS_INCLUDE_SUBDOMAINS:-true}
      APP_API_CSP_POLICY: ${APP_API_CSP_POLICY:-default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
      APP_API_FRAME_OPTIONS: ${APP_API_FRAME_OPTIONS:-DENY}
      APP_API_REFERRER_POLICY: ${APP_API_REFERRER_POLICY:-no-referrer}
      APP_API_PERMISSIONS_POLICY: ${APP_API_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=(), payment=(), usb=()}
      APP_API_CACHE_CONTROL: ${APP_API_CACHE_CONTROL:-no-store, no-cache, must-revalidate, max-age=0}
      APP_API_COOP_POLICY: ${APP_API_COOP_POLICY:-same-origin}
      APP_API_CORP_POLICY: ${APP_API_CORP_POLICY:-same-origin}
      APP_API_MAX_BODY_BYTES: ${APP_API_MAX_BODY_BYTES:-52428800}
      APP_API_RATE_LIMIT_ENABLED: ${APP_API_RATE_LIMIT_ENABLED:-true}
      APP_API_RATE_LIMIT_REQUESTS: ${APP_API_RATE_LIMIT_REQUESTS:-300}
      APP_API_RATE_LIMIT_WINDOW_SECONDS: ${APP_API_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis}/logs:/var/log/meddatasyntis
      - ${HOST_ONCOLOGIC_DIR:-/data/meddatasyntis/oncologic}/mtd:/app/application/ressources/PatientMDTForm/oncology
      - ${HOST_ONCOLOGIC_DIR:-/data/meddatasyntis/oncologic}/documents:/app/application/ressources/documents/oncology
      - ${HOST_SMA_DIR:-/data/meddatasyntis/sma}/mtd:/app/application/ressources/PatientMDTForm/sma
      - ${HOST_SMA_DIR:-/data/meddatasyntis/sma}/documents:/app/application/ressources/documents/sma

  # ─── Interface Web Material Design 3 (Fastify BFF Multi-Domaines) ───────────
  oncoflow-web:
    image: ${ONCOFLOW_WEB_IMAGE:-ghcr.io/oncoflow/oncoflow-web}:${ONCOFLOW_TAG:-latest}
    build:
      context: ../../..
      dockerfile: dist/docker/Dockerfile.web
    container_name: oncoflow-web
    restart: unless-stopped
    logging: *default-logging
    userns_mode: "keep-id"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
      APP_DEV_MODE: "false"
      APP_AUTH_MODE: "oauth_proxy"
      WEB_FAKE_API_FALLBACK: "false"
      HOST_WEB: "0.0.0.0"
      PORT_WEB: "3000"
      APP_API_URL: ${APP_QUEUE_API_URL:-http://oncoflow-api:8000}
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
      APP_LANGUAGE: ${APP_LANGUAGE:-french}
      APP_API_TOKEN: ${APP_API_TOKEN:?APP_API_TOKEN must be set in .env.prod}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}
    depends_on:
      - oncoflow-api
    networks:
      - search-community

  # ─── OAuth2 Proxy (Authentification SSO GitHub partagée sur *.meddatasyntis.bricks-it.fr)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: oncoflow-oauth2-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: "github"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_REDIRECT_URL:-https://sso.meddatasyntis.bricks-it.fr/oauth2/callback}"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr}"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_GITHUB_ORG: ${OAUTH2_PROXY_GITHUB_ORG:-}
      OAUTH2_PROXY_GITHUB_TEAM: ${OAUTH2_PROXY_GITHUB_TEAM:-}
      OAUTH2_PROXY_GITHUB_USERS: ${OAUTH2_PROXY_GITHUB_USERS:-}
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    depends_on:
      - oncoflow-web
    networks:
      - search-community

  # ─── Reverse Proxy TLS (Caddy — Let's Encrypt auto pour oncologic.*, sma.* et optionnellement *-st.*)
  caddy:
    image: caddy:2.11.7-alpine
    container_name: oncoflow-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PROD_BASE_DOMAIN: ${PROD_BASE_DOMAIN:-meddatasyntis.bricks-it.fr}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/caddy_data:/data
      - ${DOCKER_VOLUME_DIRECTORY:-/data/meddatasyntis/common}/caddy_config:/config
    depends_on:
      - oauth2-proxy
      - oncoflow-web
    networks:
      - search-community

networks:
  search-community:
    name: search-community
  milvus:
    name: milvus
    external: true
