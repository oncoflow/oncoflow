# Oncoflow stack for a homelab where LLM traffic goes through a Bifrost gateway.
#
# Bifrost is NOT started here: it is expected to already run in the homelab and
# to be reachable on the external docker network "${HOMELAB_NETWORK:-homelab}".
#
#   cp oncoflow-bifrost.env.example oncoflow-bifrost.env   # then edit it
#   docker network create homelab                          # if it does not exist yet
#   docker compose -f docker/compose/bifrost/docker-compose.yml up -d --build
#
# The UI is then served on http://<host>:${ONCOFLOW_PORT:-8501}

services:
  oncoflow:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
    image: oncoflow:bifrost
    container_name: oncoflow
    restart: unless-stopped
    command: ["uv", "run", "streamlit", "run", "app-ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - ./oncoflow-bifrost.env
    ports:
      - "${ONCOFLOW_PORT:-8501}:8501"
    volumes:
      # Uploaded patient MDT/RCP files stay on the host
      - ${ONCOFLOW_DATA_DIR:-./data}/rcp:/app/application/ressources/PatientMDTOncologicForm
    depends_on:
      - mongod
      - chromadb
    networks:
      - oncoflow
      - homelab

  mongod:
    image: mongo:8.0
    container_name: oncoflow-mongod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
    volumes:
      - ${ONCOFLOW_DATA_DIR:-./data}/mongo:/data/db
    networks:
      - oncoflow

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: oncoflow-chromadb
    restart: unless-stopped
    volumes:
      - ${ONCOFLOW_DATA_DIR:-./data}/chroma:/data
    networks:
      - oncoflow

networks:
  oncoflow:
    name: oncoflow
  homelab:
    name: ${HOMELAB_NETWORK:-homelab}
    external: true
