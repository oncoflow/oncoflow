[project]
name = "pseudonymizer"
version = "0.1.0"
description = "Pseudonymisation locale de documents médicaux (PDF/DOCX → Markdown) avec vérification humaine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "docling>=2.132.0",
  "pymupdf>=1.26",
  "edsnlp>=0.23.0",
  "eds-pseudo @ git+https://github.com/aphp/eds-pseudo@b8bfde4a0e6ca31ac5ea85483757294d48f19d03",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "faker>=30.0",
]

[project.scripts]
pseudonymizer = "pseudonymizer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15,<0.17", "httpx>=0.27", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pseudonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
