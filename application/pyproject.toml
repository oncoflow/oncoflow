[project]
name = "application"
version = "0.1.0"
description = "MedDataSyntis / Oncoflow - analyse locale de fiches RCP par LLM et RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "chromadb>=1.5.9",
    "docling-core[chunking]>=2.105.0",
    "pydantic-settings>=2.16.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-docling>=3.0.0",
    "langchain-milvus==0.3.3",
    "langchain-mongodb>=0.12.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-litellm>=0.11.2",
    "openai>=3.41.0",
    "docling>=2.145.0",
    "ollama-ocr>=0.1.6",
    "openparse>=0.7.0",
    "pandas>=3.1.0",
    "pdfminer-six>=20260107",
    "pymilvus==2.6.14",
    "pymupdf>=2.0",
    "pymongo>=4.19.0",
    "python-slugify>=9.1.3",
    "streamlit>=1.66.1",
    "streamlit-authenticator>=0.4.2",
    "streamlit-pdf-viewer>=0.0.30",
    "torch",
    "torchvision",
    "unstructured[pdf]>=0.27.36",
    "protobuf<8.0.0",
    "langchain>=1.4.7",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "json-repair>=0.64.2",
    "filetype>=1.2.0",
    "pillow>=13.0.0",
    "filelock>=4.2.4",
]

[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "filelock>=4.2.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<10",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3,<0.18",
  "pre-commit",
  "pyrefly",
  "respx>=0.23.1",
  "pytest-timeout>=2.4.0",
]

[tool.pyright]
autoSearchPaths = false
extraPaths = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app-ui.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
