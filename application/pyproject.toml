[project]
name = "application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blinker>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "chromadb>=1.3.5",
    "docling-core[chunking]>=2.77.0",
    "pydantic-settings>=2.9.0",
    "inquirer>=3.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-docling>=2.0.0",
    "langchain-experimental>=0.4.2",
    "langchain-milvus==0.3.3",
    "langchain-mongodb>=0.12.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.1.0",
    "langchain-litellm>=0.1.0",
    "openai>=1.0.0",
    "modelscope>=1.40.1",
    "docling>=2.132.0",
    "ollama-ocr>=0.1.6",
    "openparse>=0.7.0",
    "pandas>=2.2.0",
    "pdfminer-six>=20260107",
    "pymilvus==2.6.4",
    "pymupdf>=1.28.2",
    "pymongo>=4.18.1",
    "python-slugify>=9.1.2",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.57.0",
    "streamlit-authenticator>=0.4.2",
    "streamlit-pdf-viewer>=0.0.29",
    "unstructured[pdf]>=0.27.8",
    "pytz>=2026.4",
    "protobuf<7.0.0",
    "langchain>=1.3.4",
    "pyaml>=26.7.0",
]

[dependency-groups]
dev = [
  "pytest >=8.1.1,<9",
  "ruff>=0.15.14,<0.16",
  "pre-commit",
  "pyrefly"
]

[tool.pyright]
autoSearchPaths = false
extraPaths = ["."]

[tool.ruff.lint.per-file-ignores]
"app-ui.py" = ["E402"]
"app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
