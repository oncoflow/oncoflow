exclude: '^(experiment/|docker/)'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
    - id: ruff
    - id: ruff-format
-   repo: local
    hooks:
    - id: no-patient-files
      name: Refuse les fichiers patients (dépôt public)
      entry: .github/scripts/check_no_patient_files.sh
      language: script
      files: '(?i)\.(pdf|docx?|odt|rtf|xlsx?|ods|csv|hl7|dcm|sqlite3?|db|bbox)$'
