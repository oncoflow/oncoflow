exclude: '^(experiment/|docker/)'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ["--maxkb=1024"]
    -   id: detect-private-key
    -   id: check-merge-conflict
# Ruff and pyrefly run from the uv-locked versions (same as CI), not a separate pin.
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
    -   id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
