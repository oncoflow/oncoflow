redTextColor = "#882644"

orangeColor = "#B86B28"
orangeBackgroundColor = "#FBF0E4"
orangeTextColor = "#7C4718"

yellowColor = "#9E7423"
yellowBackgroundColor = "#FAF3E0"
yellowTextColor = "#6E4F12"

greenColor = "#4D7C6F"
