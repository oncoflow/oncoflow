[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "2rem"
headingFontWeights = [700, 700, 600, 600, 600, 600]

[theme.light]
# Option 1 : Papier clinique mat anti-éblouissement (#FBFDFF) + fond pierre douce (#E6ECF0) + sidebar ardoise adoucie (#2B3748)
primaryColor = "#467E79"
backgroundColor = "#E6ECF0"
secondaryBackgroundColor = "#FBFDFF"
textColor = "#2A3647"
borderColor = "#CBD5E1"
codeBackgroundColor = "#E2E8EE"
linkColor = "#467E79"

redColor = "#B83B5E"
