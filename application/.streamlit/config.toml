violetTextColor = "#3B475C"

grayColor = "#64748B"
grayBackgroundColor = "#E2E8EE"
grayTextColor = "#475569"

dataframeBorderColor = "#D5DEE6"
dataframeHeaderBackgroundColor = "#2B3748"
