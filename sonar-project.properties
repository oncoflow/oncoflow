# SonarCloud / SonarQube configuration for Oncoflow (MedDataSyntis)
sonar.organization=oncoflow
sonar.projectKey=oncoflow_oncoflow
sonar.projectName=oncoflow

# Source & test directories (Python backend/UI + TypeScript M3 Web UI)
sonar.sources=application/src,web/src
sonar.tests=application/tests,application/src/application/agent/tests,web/tests

# Language & runtime settings
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Test coverage reports generated in CI
sonar.python.coverage.reportPaths=application/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Exclusions (virtualenvs, build artifacts, dependencies, test fixtures)
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.pytest_cache/**,\
  **/.ruff_cache/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  application/src/application/agent/tests/**,\
  **/*.pdf,\
  **/*.onnx
