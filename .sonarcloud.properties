# SonarCloud Automatic Analysis configuration for Oncoflow (MedDataSyntis)
sonar.sources=application/src,web/src,web/public
sonar.tests=application/tests,web/tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Coverage exclusions (legacy Streamlit UI, entrypoints, and browser DOM scripts tested via Playwright E2E)
sonar.coverage.exclusions=\
  application/src/ui/**,\
  application/app-ui.py,\
  application/app-api.py,\
  web/public/js/**,\
  web/src/main.ts

# Exclusions (virtualenvs, build artifacts, dependencies, prototypes, test fixtures)
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.pytest_cache/**,\
  **/.ruff_cache/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  experiment/**,\
  web/styleguide/**,\
  web/scripts/**,\
  web/public/vendor/**,\
  application/src/application/agent/tests/**,\
  **/*.pdf,\
  **/*.onnx
